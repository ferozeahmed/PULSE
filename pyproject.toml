[project]
name = "pulse-tf"
version = "0.1.0"
description = "Playwright Uncomplicated Layered Scalable Execution — a base test automation framework for web and API testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic-settings>=2.4",
    "pytest>=8",
]

[project.optional-dependencies]
web = ["playwright>=1.45", "pytest-playwright>=0.5"]
api = ["httpx>=0.27"]
allure = ["allure-pytest>=2.13"]
all = ["pulse-tf[web,api,allure]", "pytest-xdist>=3.6"]

[project.entry-points.pytest11]
pulse_tf = "pulse_tf.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_tf"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["pulse_tf"]
strict = true
